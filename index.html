<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="BuildMate Pro — ваш помощник в составлении смет на ремонт">
  <title>BuildMate Pro — ваш помощник в составлении смет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ===== стили без изменений (как в оригинале) ===== */
    :root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#5b6779;--line:#e2e8f0;--accent:#2563eb;--accent-soft:#eff6ff;--green:#15803d;--green-soft:#f0fdf4;--red:#dc2626;--red-soft:#fef2f2;--pink:#e11d48;--pink-soft:#fff1f5;--gold:#b45309;--gold-soft:#fef3c7;--radius:16px;--shadow:0 1px 3px 0 rgb(0 0 0/.05),0 1px 2px -1px rgb(0 0 0/.05);--font:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text','Roboto','Helvetica Neue','Noto Sans',Arial,sans-serif}
    @media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#a1aec1;--line:#334155;--accent-soft:#1e3a8a33;--green-soft:#052e1633;--red-soft:#450a0a33;--pink-soft:#4c051933;--gold-soft:#78350f33}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;font-family:inherit}
    button{cursor:pointer;transition:all .15s ease}
    button:active{transform:scale(.98)}
    .top{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.1)}
    .toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand{font-weight:800;font-size:clamp(18px,4.6vw,22px);letter-spacing:-.4px;line-height:1.2}
    .brand .pro{font-weight:500;font-size:.6em;color:#94a3b8;letter-spacing:.4px;text-transform:uppercase}
    .sub{font-size:13px;color:#cbd5e1;margin-top:3px;line-height:1.4}
    .pill{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
    .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
    .icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:10px;width:40px;height:40px;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
    .icon-btn.hidden{display:none}
    .wrap{max-width:900px;margin:auto;padding:16px 14px 110px}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px}
    .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
    .card h2,.card h3{margin:0 0 14px;line-height:1.3}
    .card h2{font-size:19px;font-weight:700}
    .card h3{font-size:16px;font-weight:600}
    .muted{color:var(--muted);font-size:14px;line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .field label{font-size:13px;color:var(--muted);font-weight:600;line-height:1.4}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);color:var(--text);min-width:0;font-size:15px;line-height:1.4;transition:border-color .15s,box-shadow .15s}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .field textarea{min-height:88px;resize:vertical}
    .btn{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;box-shadow:0 2px 6px rgba(37,99,235,.25)}
    .btn.secondary{background:var(--accent-soft);color:var(--accent);box-shadow:none}
    .btn.outline{background:transparent;color:var(--accent);border:1px solid var(--accent);box-shadow:none}
    .btn.danger{background:var(--red-soft);color:var(--red);box-shadow:none}
    .btn.success{background:var(--green);color:#fff}
    .btn.pink{background:var(--pink);color:#fff}
    .btn.small{padding:8px 12px;font-size:13px;border-radius:8px;box-shadow:none;font-weight:600}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .stat{background:var(--accent-soft);border-radius:12px;padding:14px;min-width:0}
    .stat .n{font-size:clamp(18px,4.5vw,22px);font-weight:800;line-height:1.2}
    .stat .l{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}
    .object{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .object .grow{flex:1 1 180px;min-width:0}
    .object h3{margin:0 0 4px;font-size:16px;line-height:1.35}
    .object .money{font-weight:800;font-size:18px;white-space:nowrap}
    .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap}
    .badge.gold{background:var(--gold-soft);color:var(--gold)}
    .badge.pink{background:var(--pink-soft);color:var(--pink)}
    .listitem{border-top:1px solid var(--line);padding:16px 0}
    .listitem:first-of-type{border-top:0;padding-top:0}
    .itemhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .itemhead .grow{flex:1 1 180px;min-width:0}
    .itemhead strong{font-size:15px;font-weight:600;line-height:1.35}
    .itemmeta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
    .price{font-weight:800;white-space:nowrap;font-size:16px}
    .segment{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px;margin-bottom:16px}
    .segment button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-weight:600;font-size:13px}
    .segment button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
    .gantt-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .gantt-row:last-child{border-bottom:0}
    .gantt-label{flex:0 0 155px;font-size:14px;font-weight:600}
    .gantt-bar{flex:1 1 120px;height:26px;background:var(--accent-soft);border-radius:6px;position:relative;overflow:hidden;min-width:0}
    .gantt-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--accent),#3b82f6);border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:700;white-space:nowrap}
    .bottom{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
    .bottom button{max-width:900px;width:100%}
    .hidden{display:none !important}
    .empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:15px;line-height:1.55}
    .hint{font-size:13px;color:var(--muted);line-height:1.55}
    .hr{height:1px;background:var(--line);margin:18px 0}
    .totalrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;flex-wrap:wrap}
    .totalrow:last-child{border:0}
    .totalrow b{font-variant-numeric:tabular-nums;font-weight:700}
    .sectionlabel{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:16px 0 8px}
    .room-check{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card);font-size:15px;flex-wrap:wrap}
    .room-check input{width:20px;height:20px;flex-shrink:0}
    .room-check strong{min-width:0}
    .room-check .count{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
    .room-check .count select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px}
    .room-fields{padding:13px;background:var(--bg);border-radius:12px;margin:-4px 0 10px}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:15px;max-width:90vw;text-align:center;transition:opacity .3s;line-height:1.4}
    .unsaved{background:#fef9c3;border:1px solid #fde047;color:#713f12;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px;line-height:1.45;flex-wrap:wrap}
    .admin-hint{background:var(--gold-soft);color:#713f12;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.55;margin-top:12px}
    @media(prefers-color-scheme:dark){.admin-hint{color:#fde68a}}
    .highlight{animation:hl 1.4s ease-out}
    @keyframes hl{0%{box-shadow:0 0 0 3px var(--accent),0 0 0 6px var(--accent-soft)}100%{box-shadow:var(--shadow)}}
    .room-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s ease;min-width:0}
    .room-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
    .room-chip input{width:16px;height:16px;margin:0;flex-shrink:0}
    .room-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:8px}
    .obj-context{background:var(--accent-soft);border-radius:10px;padding:11px 13px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.4}
    .obj-context b{color:var(--accent)}
    .edit-hint{background:var(--green-soft);border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.45;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    @media(prefers-color-scheme:dark){.edit-hint{color:#bbf7d0}}
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;backdrop-filter:blur(2px);animation:fadeIn .2s ease}
    .drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;background:var(--card);z-index:51;box-shadow:4px 0 24px rgba(0,0,0,.25);animation:slideIn .25s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;overflow-y:auto}
    @keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .drawer-header{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;position:sticky;top:0;z-index:1}
    .drawer-title{font-weight:800;font-size:16px;line-height:1.25}
    .drawer-sub{font-size:12px;color:#94a3b8;margin-top:3px;line-height:1.4}
    .drawer-close{background:rgba(255,255,255,.15);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
    .drawer-nav{padding:8px;flex:1}
    .drawer-section{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;padding:14px 12px 6px;letter-spacing:.6px}
    .drawer-nav button{display:flex;width:100%;align-items:center;gap:12px;padding:12px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:10px;font-weight:600;font-size:15px}
    .drawer-nav button:hover{background:var(--bg)}
    .drawer-nav button.active{background:var(--accent-soft);color:var(--accent)}
    .drawer-nav .donate{color:var(--pink);margin-top:6px;background:var(--pink-soft)}
    .drawer-footer{padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease;overflow-y:auto}
    .modal{background:var(--card);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;position:relative;padding:24px 20px 20px;animation:popIn .25s cubic-bezier(.34,1.56,.64,1);margin:auto}
    @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-close{position:absolute;top:12px;right:12px;background:var(--bg);border:0;width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
    .modal h2{font-size:21px;margin:0 0 6px;font-weight:800;padding-right:36px}
    .modal .lead{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.55}
    .catalog-pick{max-height:400px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
    .catalog-pick-item{padding:10px 8px;cursor:pointer;border-radius:8px;transition:background .12s}
    .catalog-pick-item:hover{background:var(--bg)}
    .catalog-pick-item .itemhead{margin:0}
    .thanks-block{background:var(--pink-soft);border-radius:12px;padding:13px;margin-bottom:12px;font-size:14px;color:var(--text);line-height:1.55}
    .voice-pulse{display:inline-block;font-size:56px;line-height:1;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.65;transform:scale(1.15)}}
    .support-hero{background:linear-gradient(135deg,#fff1f5 0%,#ffe4ec 100%);border:1px solid #fecdd3;border-radius:20px;padding:22px 18px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
    @media(prefers-color-scheme:dark){.support-hero{background:linear-gradient(135deg,#4c0519 0%,#4a0519 100%);border-color:#831843}}
    .support-hero h2{margin:0 0 8px;font-size:20px;font-weight:800;color:var(--pink);display:flex;align-items:center;justify-content:center;gap:8px}
    .support-hero .lead{font-size:14px;color:var(--text);margin:0 0 16px;line-height:1.5;opacity:.85}
    .support-hero .qr-block{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px}
    .support-hero .qr-img{width:220px;height:220px;background:#fff;padding:10px;border-radius:16px;border:1px solid var(--line);box-shadow:0 4px 16px rgba(225,29,72,.15);cursor:pointer;transition:transform .2s ease}
    .support-hero .qr-img:hover{transform:scale(1.03)}
    .support-hero .qr-hint{font-size:13px;color:var(--text);opacity:.8;max-width:340px;line-height:1.45}
    .support-hero .support-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
    .support-hero .heart-anim{display:inline-block;animation:heartbeat 1.6s ease-in-out infinite}
    @keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}60%{transform:scale(1)}}
    .support-footer{background:linear-gradient(135deg,#fff1f5 0%,#ffe4ec 100%);border:1px solid #fecdd3;border-radius:16px;padding:16px;margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    @media(prefers-color-scheme:dark){.support-footer{background:linear-gradient(135deg,#4c0519 0%,#4a0519 100%);border-color:#831843}}
    .support-footer .sf-qr{width:76px;height:76px;background:#fff;padding:4px;border-radius:10px;border:1px solid var(--line);flex-shrink:0}
    .support-footer .sf-text{flex:1 1 160px;min-width:0}
    .support-footer .sf-text h3{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--pink)}
    .support-footer .sf-text p{margin:0;font-size:13px;color:var(--text);opacity:.8;line-height:1.4}
    .support-footer .sf-btn{flex-shrink:0}
    .modal-qr{width:280px;height:280px;max-width:100%;background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line);display:block;margin:0 auto 16px}
    @media(min-width:680px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-top:24px}}
    @media(max-width:420px){.grid{grid-template-columns:1fr}.grid.cols3{grid-template-columns:1fr 1fr}.card{padding:15px}.segment{flex-wrap:wrap}.segment button{flex:1 1 calc(50% - 4px)}.support-hero .qr-img{width:180px;height:180px}}
    @media(max-width:360px){body{font-size:15px}.tabs button{padding:9px 12px;font-size:13px}.card{padding:13px}.btn{padding:12px 14px;font-size:14px}.stat .n{font-size:18px}.gantt-label{flex-basis:100%}.gantt-bar{flex-basis:100%}}
  </style>
</head>
<body>
  <header class="top">
    <div class="toprow">
      <div class="brand-wrap">
        <button class="icon-btn" onclick="openMenu()" aria-label="Меню">☰</button>
        <button class="icon-btn hidden" id="backBtn" onclick="goBack()" aria-label="Назад">←</button>
        <div>
          <div class="brand">BuildMate <span class="pro">Pro</span></div>
          <div class="sub">Ваш помощник в составлении смет</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
        <span id="syncIndicator" style="font-size:18px;color:#94a3b8" title="Только локально">📱</span>
        <span class="pill">MINI APP</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" id="tabs">
      <button class="active" data-tab="home">Обзор</button>
      <button data-tab="objects">Объекты</button>
      <button data-tab="estimate">Смета</button>
      <button data-tab="stages">Этапы</button>
      <button data-tab="procurement">Закупки</button>
      <button data-tab="catalog">Расценки</button>
      <button data-tab="money">Финансы</button>
      <button data-tab="docs">Документы</button>
      <button data-tab="settings">Настройки</button>
    </nav>
    <div id="app"></div>
  </main>

  <div class="bottom"><button class="btn" id="primary">Добавить объект</button></div>

  <div id="drawerHost"></div>
  <div id="donateHost"></div>
  <div id="catalogModalHost"></div>
  <div id="voiceModalHost"></div>
  <input type="file" id="xlsxFileInput" accept=".xlsx,.xls,.csv"
    style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0"
    onchange="handleXlsxUpload(this.files[0]); this.value='';">

  <script>
    // ============ ADMIN ============
    const ADMIN_USERNAME = 'aleksandr_druzh';
    function getTgUser() { try { return window.Telegram?.WebApp?.initDataUnsafe?.user || null; } catch (e) { return null; } }
    function isAdmin() { const u = getTgUser(); if (!u) return false; return String(u.username || '').toLowerCase() === ADMIN_USERNAME.toLowerCase(); }

    // ============ DONATE ============
    const HARDCODED_DONATE = {
      name: 'Александр Д.',
      qrLink: 'https://www.sberbank.ru/ru/choise_bank?requisiteNumber=79132599269&bankCode=100000000111',
      bank: 'Сбербанк',
      telegram: 'aleksandr_druzh',
      message: 'Спасибо, что пользуетесь BuildMate Pro! Если приложение помогает — вы можете поддержать автора переводом по QR-коду. Это помогает развивать проект.'
    };

    // ============ CLOUD SYNC (SUPABASE) ============
    const SUPABASE_URL = 'https://hmkzskgrwoiyhcirzuiy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fZkizU0RwcpDjnc6OYPwbw_nPT3HyFY';
    const SUPABASE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/buildmate-api';

    let currentUserId = null;
    let cloudSyncEnabled = false;
    let cloudSaveTimer = null;
    let lastCloudSyncAt = 0;
    let cloudPollingStarted = false;

    // ✅ ИСПРАВЛЕНО: добавлен заголовок apikey (обязателен для новых ключей sb_publishable_*)
    async function cloudApi(action, data) {
      const tg = window.Telegram?.WebApp;
      const initData = tg?.initData;
      if (!initData) throw new Error('Нет initData Telegram — откройте приложение через Telegram');

      const res = await fetch(SUPABASE_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ initData, action, data })
      });

      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        throw new Error('Cloud error ' + res.status + ': ' + txt.slice(0, 300));
      }
      return res.json();
    }

    async function initCloudSync() {
      try {
        const result = await cloudApi('get');
        currentUserId = result.userId;
        cloudSyncEnabled = true;

        if (result.data && Object.keys(result.data).length > 0) {
          db = result.data;
          if (!Array.isArray(db.catalog)) db.catalog = [];
          const existingIds = new Set(db.catalog.map(x => x.id));
          DEFAULT_CATALOG.forEach(defItem => {
            if (!existingIds.has(defItem.id)) db.catalog.push(JSON.parse(JSON.stringify(defItem)));
          });
          CATALOG = db.catalog;
          migrateDB();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
          console.log('☁️ Данные загружены из облака (user: ' + currentUserId + ')');
        } else {
          await cloudApi('save', db);
          console.log('☁️ Локальные данные выгружены в облако');
        }

        lastCloudSyncAt = Date.now();
        updateSyncIndicator();
        startCloudPolling();
        render();
      } catch (e) {
        console.warn('⚠️ Cloud sync disabled:', e.message);
        cloudSyncEnabled = false;
        updateSyncIndicator();
        // Показываем пользователю мягкое уведомление (не блокирует работу)
        setTimeout(() => {
          if (!cloudSyncEnabled) {
            try { toast('📱 Облако недоступно. Данные сохраняются локально.', '#64748b'); } catch (_) {}
          }
        }, 2500);
      }
    }

    function scheduleCloudSave() {
      if (!cloudSyncEnabled) return;
      if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(async () => {
        try {
          await cloudApi('save', db);
          lastCloudSyncAt = Date.now();
          updateSyncIndicator();
        } catch (e) {
          console.warn('Cloud save error:', e.message);
        }
      }, 1500);
    }

    function startCloudPolling() {
      if (cloudPollingStarted) return;
      cloudPollingStarted = true;
      setInterval(async () => {
        if (!cloudSyncEnabled) return;
        const ae = document.activeElement;
        if (ae && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName)) return;
        if (typeof catalogEditState !== 'undefined' && catalogEditState) return;
        if (typeof estimateAddState !== 'undefined' && estimateAddState) return;
        if (typeof estimateItemVoiceState !== 'undefined' && estimateItemVoiceState) return;
        if (typeof menuOpen !== 'undefined' && menuOpen) return;
        if (typeof donateOpen !== 'undefined' && donateOpen) return;
        try {
          const result = await cloudApi('get');
          if (result.data && JSON.stringify(result.data) !== JSON.stringify(db)) {
            db = result.data;
            if (!Array.isArray(db.catalog)) db.catalog = [];
            CATALOG = db.catalog;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            lastCloudSyncAt = Date.now();
            updateSyncIndicator();
            render();
            toast('🔄 Данные обновлены с другого устройства', '#2563eb');
          }
        } catch (e) { /* silent */ }
      }, 15000);
    }

    function updateSyncIndicator() {
      const el = document.getElementById('syncIndicator');
      if (!el) return;
      if (cloudSyncEnabled) {
        el.textContent = '☁️';
        el.title = 'Синхронизация с облаком активна';
        el.style.color = '#22c55e';
      } else {
        el.textContent = '📱';
        el.title = 'Только локальное хранилище';
        el.style.color = '#94a3b8';
      }
    }

    async function manualCloudSync() {
      if (!cloudSyncEnabled) { toast('Синхронизация не подключена', '#dc2626'); return; }
      try {
        toast('⏳ Синхронизация...', '#64748b');
        await cloudApi('save', db);
        const result = await cloudApi('get');
        if (result.data) {
          db = result.data;
          if (!Array.isArray(db.catalog)) db.catalog = [];
          CATALOG = db.catalog;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }
        lastCloudSyncAt = Date.now();
        updateSyncIndicator();
        toast('✅ Данные синхронизированы');
        render();
      } catch (e) { toast('Ошибка: ' + e.message, '#dc2626'); }
    }

    // ============ УТИЛИТЫ ============
    const fmt = n => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(Number(n) || 0) + ' ₽';
    const num = n => Math.max(0, Number(n) || 0);
    const uid = () => Math.random().toString(36).slice(2, 10);
    const today = () => new Date().toISOString().slice(0, 10);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const OBJECT_KINDS = ['Новостройка', 'Квартира вторичный фонд', 'Дом', 'Другое'];
    const STAGES_ALL = ['Демонтаж', 'Инженерия', 'Черновые', 'Чистовые', 'Сдача'];
    const ROOM_EMOJI_MAP = { bedroom: '🛏️', living: '🛋️', kids: '🧸', kitchen: '🍳', bathroom: '🛁', toilet: '🚽', combined: '🚿', hallway: '🚪', balcony: '🌇' };

    function kindLabel(k) { return (k || 'Другое'); }
    function statusLabel(s) { return s || ''; }
    function stageLabel(s) { return s || 'Черновые'; }
    function roomEmoji(room) { return room ? (ROOM_EMOJI_MAP[room.type] || '🚪') : '🚪'; }

    function toast(msg, color) {
      const existing = document.getElementById('toast'); if (existing) existing.remove();
      const t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.textContent = msg;
      if (color) t.style.background = color;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; }, 2400);
      setTimeout(() => { t.remove(); }, 2800);
    }

    function copyText(text, btn) {
      const success = () => { if (btn) { const orig = btn.textContent; btn.textContent = '✓'; btn.disabled = true; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1600); } toast('📋 Скопировано'); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(success).catch(() => fallbackCopy(text, success)); }
      else { fallbackCopy(text, success); }
    }
    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); cb(); } catch (e) { alert('Скопируйте вручную:\n' + text); }
      ta.remove();
    }

    // ============ DOWNLOAD / EXCEL / PDF ============
    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) {
          const check = setInterval(() => { if (window.XLSX || window.pdfMake) { clearInterval(check); resolve(); } }, 50);
          setTimeout(() => { clearInterval(check); resolve(); }, 3000);
          return;
        }
        const s = document.createElement('script');
        s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('Не удалось загрузить ' + src));
        document.head.appendChild(s);
      });
    }
    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob);
      });
    }
    async function saveBlob(blob, filename) {
      const isTelegram = !!window.Telegram?.WebApp?.initData;
      if (isTelegram && typeof window.Telegram.WebApp.downloadFile === 'function') {
        try { const dataUrl = await blobToDataURL(blob); window.Telegram.WebApp.downloadFile({ url: dataUrl, file_name: filename }); toast('✅ Файл передан на скачивание'); return true; }
        catch (e) { console.warn('Telegram.downloadFile failed:', e); }
      }
      try {
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(() => { if (a.parentNode) a.parentNode.removeChild(a); try { URL.revokeObjectURL(url); } catch (e) { } }, 1500);
        toast('✅ Файл скачан'); return true;
      } catch (e) { console.warn('a.download failed:', e); }
      try {
        const dataUrl = await blobToDataURL(blob);
        if (isTelegram && window.Telegram.WebApp.openLink) { window.Telegram.WebApp.openLink(dataUrl); } else { window.open(dataUrl, '_blank'); }
        toast('📥 Файл открыт. Сохраните его через меню браузера.', '#64748b'); return true;
      } catch (e) { console.warn('Open fallback failed:', e); }
      alert('Не удалось сохранить файл.'); return false;
    }
    async function buildExcelBlob(rows, sheetName) {
      if (!window.XLSX) { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const colWidths = [];
      rows.forEach(row => { row.forEach((cell, idx) => { const len = String(cell ?? '').length; colWidths[idx] = Math.max(colWidths[idx] || 8, Math.min(50, len + 2)); }); });
      ws['!cols'] = colWidths.map(w => ({ wch: w }));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Смета');
      return await new Promise((resolve, reject) => { try { XLSX.write(wb, { bookType: 'xlsx', type: 'blob' }, (b) => resolve(b)); } catch (e) { reject(e); } });
    }
    async function ensurePdfMake() {
      if (window.pdfMake && window.pdfMake.vfs) return;
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js');
      if (!window.pdfMake || !window.pdfMake.vfs) { throw new Error('Не удалось загрузить pdfmake'); }
    }
    async function buildPdfBlob(docDefinition) {
      await ensurePdfMake();
      return await new Promise((resolve, reject) => { try { pdfMake.createPdf(docDefinition).getBlob(blob => resolve(blob)); } catch (e) { reject(e); } });
    }

    // ============ КАТАЛОГ (сокращён для примера — вставьте ваш полный DEFAULT_CATALOG) ============

    const ROOM_TYPES = [

      { key: 'balcony', label: 'Балкон / Лоджия', emoji: '🌇', max: 2, wet: false }
    ];

    const RESIDENTIAL_PRESET = ['c1','c6','f1','f5','f9','e3','f11','m1','m2','m4','m6','m10','m16','m17','m20','m19'];
    const WET_PRESET_FULL = ['c5','f3','f4','f6','p1','p2','p3','s1','s3','s5','f11','m5','m8','m12','m13','m14','m15','m21','m23','m24','m19'];

    const ROOM_PRESETS = {
      bedroom: RESIDENTIAL_PRESET, living: RESIDENTIAL_PRESET, kids: RESIDENTIAL_PRESET, residential: RESIDENTIAL_PRESET,
      kitchen: ['c1','c5','f3','f4','f6','p1','p2','e3','m1','m4','m5','m8','m12','m13','m14','m15'],
      bathroom: WET_PRESET_FULL, combined: WET_PRESET_FULL, wet: WET_PRESET_FULL,
      toilet: TOILET_PRESET,
      hallway: ['c1','c6','f2','f6','f11','e3','m1','m2','m4','m6','m11','m19'],
      balcony: ['c3','c9','f5','e5','b1','b2','m3','m4','m16','m17','m27','m28']
    };

    // ============ ХРАНИЛИЩЕ ============
    const STORAGE_KEY = 'smetchik22_pro';
    let db;
    try { db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { db = null; }
    if (!db) {
      db = { company: '', region: 'Новосибирск', markup: 10, waste: 10, inn: '', ogrn: '', legalAddress: '', director: '', phone: '', email: '', website: '', contractPrefix: 'BM', objects: [], versions: {}, catalog: [], donateQrLink: '', donateTelegram: '', donateMessage: '', donateName: '' };
    }
    ['inn','ogrn','legalAddress','director','phone','email','website','donateTelegram','donateMessage','donateName','donateQrLink'].forEach(k => { if (db[k] === undefined) db[k] = ''; });
    if (!db.contractPrefix) db.contractPrefix = 'BM';
    if (db.company === 'Сметчик_22' || db.company === 'BuildMate Pro') { db.company = ''; }
    if (typeof db.company !== 'string') db.company = '';
    if (!Array.isArray(db.catalog)) db.catalog = [];
    (function ensureFullCatalog() {
      const existingIds = new Set(db.catalog.map(x => x.id));
      let restored = 0;
      DEFAULT_CATALOG.forEach(defItem => { if (!existingIds.has(defItem.id)) { db.catalog.push(JSON.parse(JSON.stringify(defItem))); restored++; } });
      if (restored > 0) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) { } }
    })();
    let CATALOG = db.catalog;

    function migrateDB() {
      if (!db || !db.objects) return;
      let changed = false;
      db.objects.forEach(o => {
        (o.items || []).forEach(i => { if (i.roomName && i.name && i.name.endsWith(' (' + i.roomName + ')')) { i.name = i.name.slice(0, -(' (' + i.roomName + ')').length); changed = true; } });
        if (o.kind === 'Ванная комната' || o.kind === 'Санузел' || o.kind === 'Совмещённый санузел') { o.kind = 'Другое'; changed = true; }
        if (o.kind && !OBJECT_KINDS.includes(o.kind)) { const found = OBJECT_KINDS.find(k => o.kind.includes(k)); if (found) { o.kind = found; changed = true; } }
      });
      if (changed) save();
    }
    migrateDB();

    let tab = 'home', selected = db.objects[0]?.id || null, editingItem = null, estimateView = 'sections', wizard = null;
    let estimateRoomFilter = [];
    let settingsDraft = null;
    let menuOpen = false;
    let donateOpen = false;
    let estimateItemVoiceState = null;
    let estimateAddState = null;

    let saveTimeout = null;
    function save() { db.catalog = CATALOG; localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); scheduleCloudSave(); }
    function saveDebounced() { if (saveTimeout) clearTimeout(saveTimeout); saveTimeout = setTimeout(() => { save(); saveTimeout = null; }, 250); }
    function obj() { return db.objects.find(o => o.id === selected); }

    // ============ НАСТРОЙКИ / НАВИГАЦИЯ / МЕНЮ / ДОНАТ ============
    // (без изменений относительно вашего файла — оставляю как есть)

    // (без изменений — используется как в вашем файле)

    if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }

    initCloudSync();

<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="BuildMate Pro — ваш помощник в составлении смет на ремонт">
  <title>BuildMate Pro — ваш помощник в составлении смет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #fff;
      --text: #0f172a;
      --muted: #5b6779;
      --line: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --green: #15803d;
      --green-soft: #f0fdf4;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --pink: #e11d48;
      --pink-soft: #fff1f5;
      --gold: #b45309;
      --gold-soft: #fef3c7;
      --radius: 16px;
      --shadow: 0 1px 3px 0 rgb(0 0 0/.05), 0 1px 2px -1px rgb(0 0 0/.05);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', 'Roboto', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif;
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #a1aec1;
        --line: #334155;
        --accent-soft: #1e3a8a33;
        --green-soft: #052e1633;
        --red-soft: #450a0a33;
        --pink-soft: #4c051933;
        --gold-soft: #78350f33
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      letter-spacing: 0;
      overflow-wrap: break-word;
      word-break: normal;
      hyphens: auto;
      -webkit-hyphens: auto;
      text-wrap: pretty;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'kern' 1, 'liga' 1
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      font-family: inherit;
      overflow-wrap: break-word
    }

    input,
    textarea {
      hyphens: none;
      -webkit-hyphens: none
    }

    button {
      cursor: pointer;
      transition: all .15s ease
    }

    button:active {
      transform: scale(.98)
    }

    .top {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      padding: 18px 16px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .1)
    }

    .toprow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .brand {
      font-weight: 800;
      font-size: clamp(18px, 4.6vw, 22px);
      letter-spacing: -.4px;
      line-height: 1.2;
      text-wrap: balance
    }

    .brand .pro {
      font-weight: 500;
      font-size: 0.6em;
      color: #94a3b8;
      letter-spacing: .4px;
      text-transform: uppercase
    }

    .sub {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 3px;
      line-height: 1.4
    }

    .pill {
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 99px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      white-space: nowrap;
      flex-shrink: 0
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .icon-btn {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0
    }

    .icon-btn.hidden {
      display: none
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 16px 14px 110px
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 16px;
      scrollbar-width: none;
      -ms-overflow-style: none
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tabs button {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0
    }

    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .3)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .card h2,
    .card h3 {
      margin: 0 0 14px;
      line-height: 1.3;
      text-wrap: balance;
      letter-spacing: -.2px
    }

    .card h2 {
      font-size: 19px;
      font-weight: 700
    }

    .card h3 {
      font-size: 16px;
      font-weight: 600
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    .grid.cols3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.4
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--card);
      color: var(--text);
      min-width: 0;
      font-size: 15px;
      line-height: 1.4;
      transition: border-color .15s, box-shadow .15s
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft)
    }

    .field textarea {
      min-height: 88px;
      resize: vertical
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0;
      box-shadow: 0 2px 6px rgba(37, 99, 235, .25);
      line-height: 1.3
    }

    .btn:hover {
      filter: brightness(1.05)
    }

    .btn.secondary {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: none;
      border: 1px solid transparent
    }

    .btn.outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      box-shadow: none
    }

    .btn.danger {
      background: var(--red-soft);
      color: var(--red);
      box-shadow: none
    }

    .btn.success {
      background: var(--green);
      color: #fff
    }

    .btn.pink {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 2px 6px rgba(225, 29, 72, .25)
    }

    .btn.small {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 8px;
      box-shadow: none;
      font-weight: 600
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px
    }

    .stat {
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid transparent;
      min-width: 0
    }

    .stat .n {
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 800;
      letter-spacing: -.4px;
      line-height: 1.2;
      overflow-wrap: break-word
    }

    .stat .l {
      font-size: 13px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.4
    }

    .object {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap
    }

    .object .grow {
      flex: 1 1 180px;
      min-width: 0
    }

    .object h3 {
      margin: 0 0 4px;
      font-size: 16px;
      overflow-wrap: break-word;
      line-height: 1.35
    }

    .object .money {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -.3px;
      white-space: nowrap
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap
    }

    .badge.gold {
      background: var(--gold-soft);
      color: var(--gold)
    }

    .badge.pink {
      background: var(--pink-soft);
      color: var(--pink)
    }

    .listitem {
      border-top: 1px solid var(--line);
      padding: 16px 0
    }

    .listitem:first-of-type {
      border-top: 0;
      padding-top: 0
    }

    .itemhead {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap
    }

    .itemhead .grow {
      flex: 1 1 180px;
      min-width: 0
    }

    .itemhead strong {
      font-size: 15px;
      font-weight: 600;
      overflow-wrap: break-word;
      line-height: 1.35
    }

    .itemmeta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      overflow-wrap: break-word;
      line-height: 1.45
    }

    .price {
      font-weight: 800;
      white-space: nowrap;
      font-size: 16px
    }

    .segment {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 16px
    }

    .segment button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      min-width: 0;
      overflow-wrap: break-word;
      line-height: 1.3
    }

    .segment button.active {
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow)
    }

    .gantt-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap
    }

    .gantt-row:last-child {
      border-bottom: 0
    }

    .gantt-label {
      flex: 0 0 155px;
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: break-word
    }

    .gantt-bar {
      flex: 1 1 120px;
      height: 26px;
      background: var(--accent-soft);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      min-width: 0
    }

    .gantt-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #3b82f6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-size: 11px;
      color: #fff;
      font-weight: 700;
      white-space: nowrap
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      z-index: 20
    }

    .bottom button {
      max-width: 900px;
      width: 100%
    }

    .hidden {
      display: none !important
    }

    .empty {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      text-wrap: pretty
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      text-wrap: pretty
    }

    .hr {
      height: 1px;
      background: var(--line);
      margin: 18px 0
    }

    .totalrow {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      flex-wrap: wrap
    }

    .totalrow:last-child {
      border: 0
    }

    .totalrow b {
      font-variant-numeric: tabular-nums;
      font-weight: 700
    }

    .sectionlabel {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      font-weight: 800;
      margin: 16px 0 8px
    }

    .room-check {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      background: var(--card);
      font-size: 15px;
      flex-wrap: wrap
    }

    .room-check input {
      width: 20px;
      height: 20px;
      flex-shrink: 0
    }

    .room-check strong {
      min-width: 0;
      overflow-wrap: break-word
    }

    .room-check .count {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0
    }

    .room-check .count select {
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 14px
    }

    .room-fields {
      padding: 13px;
      background: var(--bg);
      border-radius: 12px;
      margin: -4px 0 10px
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--green);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
      font-size: 15px;
      max-width: 90vw;
      text-align: center;
      transition: opacity .3s;
      line-height: 1.4
    }

    .unsaved {
      background: #fef9c3;
      border: 1px solid #fde047;
      color: #713f12;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.45;
      flex-wrap: wrap
    }

    .admin-hint {
      background: var(--gold-soft);
      color: #713f12;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.55;
      margin-top: 12px;
      text-wrap: pretty
    }

    @media (prefers-color-scheme:dark) {
      .admin-hint {
        color: #fde68a
      }
    }

    .highlight {
      animation: hl 1.4s ease-out
    }

    @keyframes hl {
      0% {
        box-shadow: 0 0 0 3px var(--accent), 0 0 0 6px var(--accent-soft)
      }

      100% {
        box-shadow: var(--shadow)
      }
    }

    .room-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all .15s ease;
      min-width: 0;
      overflow-wrap: break-word;
      line-height: 1.35
    }

    .room-chip.on {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent)
    }

    .room-chip input {
      width: 16px;
      height: 16px;
      margin: 0;
      flex-shrink: 0
    }

    .room-chips {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 6px;
      margin-top: 8px
    }

    .obj-context {
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      line-height: 1.4
    }

    .obj-context b {
      color: var(--accent);
      overflow-wrap: break-word
    }

    .edit-hint {
      background: var(--green-soft);
      border: 1px solid #bbf7d0;
      color: #166534;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    @media (prefers-color-scheme:dark) {
      .edit-hint {
        color: #bbf7d0
      }
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 50;
      backdrop-filter: blur(2px);
      animation: fadeIn .2s ease
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 300px;
      max-width: 85vw;
      background: var(--card);
      z-index: 51;
      box-shadow: 4px 0 24px rgba(0, 0, 0, .25);
      animation: slideIn .25s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto
    }

    @keyframes slideIn {
      from {
        transform: translateX(-100%)
      }

      to {
        transform: translateX(0)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .drawer-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 1
    }

    .drawer-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -.2px;
      line-height: 1.25;
      overflow-wrap: break-word
    }

    .drawer-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
      line-height: 1.4
    }

    .drawer-close {
      background: rgba(255, 255, 255, .15);
      border: 0;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0
    }

    .drawer-nav {
      padding: 8px;
      flex: 1
    }

    .drawer-section {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      padding: 14px 12px 6px;
      letter-spacing: .6px
    }

    .drawer-nav button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      overflow-wrap: break-word;
      line-height: 1.3
    }

    .drawer-nav button:hover {
      background: var(--bg)
    }

    .drawer-nav button.active {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .drawer-nav .donate {
      color: var(--pink);
      margin-top: 6px;
      background: var(--pink-soft)
    }

    .drawer-nav .donate:hover {
      background: var(--pink-soft);
      filter: brightness(.97)
    }

    .drawer-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn .2s ease;
      overflow-y: auto
    }

    .modal {
      background: var(--card);
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 24px 20px 20px;
      animation: popIn .25s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin: auto
    }

    @keyframes popIn {
      from {
        transform: scale(.92);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--bg);
      border: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 20px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;

  <script>
    // ============ ADMIN ============
    const ADMIN_USERNAME = 'aleksandr_druzh';
    function getTgUser() {try {return window.Telegram?.WebApp?.initDataUnsafe?.user || null;} catch (e) {return null;} }
    function isAdmin() {const u = getTgUser(); if (!u) return false; return String(u.username || '').toLowerCase() === ADMIN_USERNAME.toLowerCase();}

    // ============ DONATE ============
    const HARDCODED_DONATE = {
      name: 'Александр Д.',
      qrLink: 'https://www.sberbank.ru/ru/choise_bank?requisiteNumber=79132599269&bankCode=100000000111',
      bank: 'Сбербанк',
      telegram: 'aleksandr_druzh',
      message: 'Спасибо, что пользуетесь BuildMate Pro! Если приложение помогает — вы можете поддержать автора переводом по QR-коду. Это помогает развивать проект.'
    };

    // ============ CLOUD SYNC (SUPABASE) ============
    const SUPABASE_URL = 'https://hmkzskgrwoiyhcirzuiy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fZkizU0RwcpDjnc6OYPwbw_nPT3HyFY';
    const SUPABASE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/buildmate-api';

    let currentUserId = null;
    let cloudSyncEnabled = false;
    let cloudSyncFatal = false;
    let cloudSaveTimer = null;
    let cloudSaving = false;
    let lastCloudSyncAt = 0;
    let cloudPollingStarted = false;
    let cloudError = '';
    let cloudRetryTimer = null;

    // ✅ ИСПРАВЛЕНО: добавлен заголовок apikey (обязателен для новых ключей sb_publishable_*)
    async function cloudApi(action, data) {
      const tg = window.Telegram?.WebApp;
      const initData = tg?.initData;
      if (!initData) throw new Error('Нет initData Telegram — откройте приложение через Telegram');
      const res = await fetch(SUPABASE_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'x-client-info': 'buildmate-pro/1.8'
        },
        body: JSON.stringify({initData, action, data})
      });
      if (!res.ok) {
        const txt = await res.text().catch(() => '');
        const err = new Error('Cloud error ' + res.status + ': ' + txt.slice(0, 300));
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    async function initCloudSync() {
      try {
        const result = await cloudApi('get');
        currentUserId = result.userId;
        cloudSyncEnabled = true;
        cloudSyncFatal = false;
        cloudError = '';
        if (result.data && Object.keys(result.data).length > 0) {
          db = result.data;
          if (!Array.isArray(db.catalog)) db.catalog = [];
          const existingIds = new Set(db.catalog.map(x => x.id));
          DEFAULT_CATALOG.forEach(defItem => {
            if (!existingIds.has(defItem.id)) db.catalog.push(JSON.parse(JSON.stringify(defItem)));
          });
          CATALOG = db.catalog;
          migrateDB();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
          console.log('☁️ Данные загружены из облака (user: ' + currentUserId + ')');
        } else {
          await cloudApi('save', db);
          console.log('☁️ Локальные данные выгружены в облако');
        }
        lastCloudSyncAt = Date.now();
        updateSyncIndicator();
        startCloudPolling();
        render();
      } catch (e) {
        console.warn('⚠️ Cloud sync init failed:', e.message);
        cloudSyncEnabled = false;
        cloudError = e.message;
        if (e.status === 401 || e.status === 403) {
          cloudSyncFatal = true;
        } else {
          scheduleCloudRetry();
        }
        updateSyncIndicator();
      }
    }

    // ✅ НОВОЕ: отложенный повтор инициализации при временной ошибке сети
    function scheduleCloudRetry() {
      if (cloudRetryTimer || cloudSyncFatal) return;
      cloudRetryTimer = setTimeout(async () => {
        cloudRetryTimer = null;
        if (cloudSyncEnabled || cloudSyncFatal) return;
        console.log('☁️ Retry cloud sync...');
        await initCloudSync();
      }, 30000);
    }

    function scheduleCloudSave() {
      if (!cloudSyncEnabled || cloudSaving) return;
      if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(async () => {
        cloudSaveTimer = null;
        if (cloudSaving) return;
        cloudSaving = true;
        try {
          await cloudApi('save', db);
          lastCloudSyncAt = Date.now();
          cloudError = '';
          updateSyncIndicator();
        } catch (e) {
          console.warn('Cloud save error:', e.message);
          cloudError = e.message;
          if (e.status !== 401 && e.status !== 403) {
            setTimeout(() => {if (cloudSyncEnabled) scheduleCloudSave();}, 5000);
          } else {
            cloudSyncFatal = true;
            cloudSyncEnabled = false;
            updateSyncIndicator();
          }
        } finally {
          cloudSaving = false;
        }
      }, 1500);
    }

    function startCloudPolling() {
      if (cloudPollingStarted) return;
      cloudPollingStarted = true;
      setInterval(async () => {
        if (!cloudSyncEnabled) return;
        const ae = document.activeElement;
        if (ae && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName)) return;
        if (typeof catalogEditState !== 'undefined' && catalogEditState) return;
        if (typeof estimateAddState !== 'undefined' && estimateAddState) return;
        if (typeof estimateItemVoiceState !== 'undefined' && estimateItemVoiceState) return;
        if (typeof menuOpen !== 'undefined' && menuOpen) return;
        if (typeof donateOpen !== 'undefined' && donateOpen) return;
        if (saveTimeout || cloudSaving) return;
        try {
          const result = await cloudApi('get');
          if (result.data) {
            const remoteStr = JSON.stringify(result.data);
            const localStr = JSON.stringify(db);
            if (remoteStr !== localStr) {
              db = result.data;
              if (!Array.isArray(db.catalog)) db.catalog = [];
              CATALOG = db.catalog;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
              lastCloudSyncAt = Date.now();
              updateSyncIndicator();
              render();
              toast('🔄 Данные обновлены с другого устройства', '#2563eb');
            }
          }
        } catch (e) {
          if (e.status === 401 || e.status === 403) {
            cloudSyncFatal = true;
            cloudSyncEnabled = false;
            updateSyncIndicator();
          }
        }
      }, 15000);
    }

    function updateSyncIndicator() {
      const el = document.getElementById('syncIndicator');
      if (!el) return;
      if (cloudSyncEnabled) {
        el.textContent = '☁️';
        el.title = 'Синхронизация с облаком активна';
        el.style.color = '#22c55e';
      } else {
        el.textContent = '📱';
        el.title = cloudError ? ('Облако: ' + cloudError) : 'Только локальное хранилище';
        el.style.color = cloudError ? '#f59e0b' : '#94a3b8';
      }
    }

    async function manualCloudSync() {
      if (!cloudSyncEnabled) {
        if (cloudSyncFatal) {
          toast('Ошибка авторизации Supabase (401/403). Проверьте ключ.', '#dc2626');
        } else {
          toast('Переподключение к облаку...', '#64748b');
          await initCloudSync();
        }
        return;
      }
      try {
        toast('⏳ Синхронизация...', '#64748b');
        cloudSaving = true;
        await cloudApi('save', db);
        const result = await cloudApi('get');
        if (result.data) {
          db = result.data;
          if (!Array.isArray(db.catalog)) db.catalog = [];
          CATALOG = db.catalog;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }
        lastCloudSyncAt = Date.now();
        cloudError = '';
        updateSyncIndicator();
        toast('✅ Данные синхронизированы');
        render();
      } catch (e) {
        cloudError = e.message;
        updateSyncIndicator();
        toast('Ошибка: ' + e.message, '#dc2626');
      } finally {
        cloudSaving = false;
      }
    }











    // ============ УТИЛИТЫ ============
    const fmt = n => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2}).format(Number(n) || 0) + ' ₽';
    const num = n => Math.max(0, Number(n) || 0);
    const uid = () => Math.random().toString(36).slice(2, 10);
    const today = () => new Date().toISOString().slice(0, 10);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

    const OBJECT_KINDS = ['Новостройка', 'Квартира вторичный фонд', 'Дом', 'Другое'];
    const STAGES_ALL = ['Демонтаж', 'Инженерия', 'Черновые', 'Чистовые', 'Сдача'];
    const ROOM_EMOJI_MAP = {bedroom: '🛏️', living: '🛋️', kids: '🧸', kitchen: '🍳', bathroom: '🛁', toilet: '🚽', combined: '🚿', hallway: '🚪', balcony: '🌇'};

    function kindLabel(k) {return (k || 'Другое');}
    function statusLabel(s) {return s || '';}
    function stageLabel(s) {return s || 'Черновые';}
    function roomEmoji(room) {return room ? (ROOM_EMOJI_MAP[room.type] || '🚪') : '🚪';}

    function toast(msg, color) {
      const existing = document.getElementById('toast'); if (existing) existing.remove();
      const t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.textContent = msg;
      if (color) t.style.background = color;
      document.body.appendChild(t);
      setTimeout(() => {t.style.opacity = '0';}, 2400);
      setTimeout(() => {t.remove();}, 2800);
    }

    function copyText(text, btn) {
      const success = () => {if (btn) {const orig = btn.textContent; btn.textContent = '✓'; btn.disabled = true; setTimeout(() => {btn.textContent = orig; btn.disabled = false;}, 1600);} toast('📋 Скопировано');};
      if (navigator.clipboard && navigator.clipboard.writeText) {navigator.clipboard.writeText(text).then(success).catch(() => fallbackCopy(text, success));}
      else {fallbackCopy(text, success);}
    }
    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try {document.execCommand('copy'); cb();} catch (e) {alert('Скопируйте вручную:\n' + text);}
      ta.remove();
    }

    // ============ DOWNLOAD / EXCEL / PDF ============
    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector('script[src="' + src + '"]')) {
          const check = setInterval(() => {if (window.XLSX || window.pdfMake) {clearInterval(check); resolve();} }, 50);
          setTimeout(() => {clearInterval(check); resolve();}, 3000);
          return;
        }
        const s = document.createElement('script');
        s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('Не удалось загрузить ' + src));
        document.head.appendChild(s);
      });
    }
    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob);
      });
    }
    async function saveBlob(blob, filename) {
      const isTelegram = !!window.Telegram?.WebApp?.initData;
      if (isTelegram && typeof window.Telegram.WebApp.downloadFile === 'function') {
        try {const dataUrl = await blobToDataURL(blob); window.Telegram.WebApp.downloadFile({url: dataUrl, file_name: filename}); toast('✅ Файл передан на скачивание'); return true;}
        catch (e) {console.warn('Telegram.downloadFile failed:', e);}
      }
      try {
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(() => {if (a.parentNode) a.parentNode.removeChild(a); try {URL.revokeObjectURL(url);} catch (e) { } }, 1500);
        toast('✅ Файл скачан'); return true;
      } catch (e) {console.warn('a.download failed:', e);}
      try {
        const dataUrl = await blobToDataURL(blob);
        if (isTelegram && window.Telegram.WebApp.openLink) {window.Telegram.WebApp.openLink(dataUrl);} else {window.open(dataUrl, '_blank');}
        toast('📥 Файл открыт. Сохраните его через меню браузера.', '#64748b'); return true;
      } catch (e) {console.warn('Open fallback failed:', e);}
      alert('Не удалось сохранить файл.'); return false;
    }
    async function buildExcelBlob(rows, sheetName) {
      if (!window.XLSX) {await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');}
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const colWidths = [];
      rows.forEach(row => {row.forEach((cell, idx) => {const len = String(cell ?? '').length; colWidths[idx] = Math.max(colWidths[idx] || 8, Math.min(50, len + 2));});});
      ws['!cols'] = colWidths.map(w => ({wch: w}));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Смета');
      return await new Promise((resolve, reject) => {try {XLSX.write(wb, {bookType: 'xlsx', type: 'blob'}, (b) => resolve(b));} catch (e) {reject(e);} });
    }
    async function ensurePdfMake() {
      if (window.pdfMake && window.pdfMake.vfs) return;
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js');
      if (!window.pdfMake || !window.pdfMake.vfs) {throw new Error('Не удалось загрузить pdfmake');}
    }
    async function buildPdfBlob(docDefinition) {
      await ensurePdfMake();
      return await new Promise((resolve, reject) => {try {pdfMake.createPdf(docDefinition).getBlob(blob => resolve(blob));} catch (e) {reject(e);} });
    }

    const DEFAULT_CATALOG = [
      {id: 'd1', group: 'Демонтаж', name: 'Демонтаж старой штукатурки', unit: 'м²', price: 220, type: 'work', stage: 'Демонтаж', rooms: ['bedroom', 'living', 'kids', 'kitchen', 'bathroom', 'toilet', 'combined', 'hallway', 'balcony']},

    function openExcelImport() {document.getElementById('xlsxFileInput').click();}
    function handleXlsxUpload(file) {
      if (!file) return;
      ensureXlsx().then(() => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]]; if (!sheet) {alert('В файле нет ни одного листа'); return;}
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ''});
            const parsed = parseCatalogRows(rows);
            if (!parsed.items.length) {alert('Не удалось найти позиции для импорта.'); return;}
            showImportPreview(parsed);
          } catch (err) {alert('Ошибка чтения файла: ' + err.message);}
        };
        reader.readAsArrayBuffer(file);
      }).catch(err => alert(err.message));
    }
    function parseCatalogRows(rows) {
      let colMap = null, start = 0;
      if (rows.length > 0) {

    function card(title, body, extra = '') {return `<section class="card">${title ? `<h2>${title}</h2>` : ''}${body}${extra}</section>`;}
    function empty(s) {return `<div class="empty">${s}</div>`;}

          selectorCard += `</section>`;
          const scopeLabel = !hasRooms ? 'Весь объект' : (filterActive ? 'Выбрано: ' + estimateRoomFilter.map(id => {const r = o.rooms.find(r => r.id === id); return r ? roomEmoji(r) + ' ' + r.name : '';}).filter(Boolean).join(', ') : 'Все комнаты');
          let headCard = card('📋 Смета', `<div class="muted">${esc(o.name)} · ${esc(o.kind || '—')} · ${esc(scopeLabel)}</div><div class="stats" style="margin-top:12px"><div class="stat"><div class="n">🔧 ${fmt(t.work)}</div><div class="l">Работы</div></div><div class="stat"><div class="n">📦 ${fmt(t.mat)}</div><div class="l">Материалы</div></div><div class="stat"><div class="n">📈 ${fmt(t.markup)}</div><div class="l">Наценка ${num(db.markup)}%</div></div><div class="stat"><div class="n">💰 ${fmt(t.total)}</div><div class="l">Итого</div></div></div><div class="actions"><button class="btn" onclick="openAddEstimateItem()">➕ Позиция</button>${hasRooms ? `<button class="btn secondary" onclick="startVoiceEstimateItem()">🎤 Голосом</button>` : ''}<button class="btn secondary" onclick="regenerateEstimate()">🔄 Пересчитать</button><button class="btn secondary" onclick="saveVersion()">💾 Версия</button><button class="btn outline" onclick="exportExcel()">📊 Excel${filterActive ? ' (фильтр)' : ''}</button><button class="btn outline" onclick="printDoc('estimate')">📄 PDF</button></div>`);
          let segment = `<div class="segment"><button class="${estimateView === 'sections' ? 'active' : ''}" onclick="estimateView='sections';render()">📑 Разделы</button><button class="${estimateView === 'stages' ? 'active' : ''}" onclick="estimateView='stages';render()">📅 Этапы</button><button class="${estimateView === 'rooms' ? 'active' : ''}" onclick="estimateView='rooms';render()">🚪 Комнаты</button></div>`;
          let bodyHtml = '';
          if (estimateView === 'sections') {const works = items.filter(i => i.type === 'work'); const mats = items.filter(i => i.type === 'material'); bodyHtml += card('📝 Позиции', ''); if (works.length) {bodyHtml += `<div class="sectionlabel">🔧 Работы · ${fmt(t.work)}</div>` + works.map(itemRow).join('');} if (mats.length) {bodyHtml += `<div class="sectionlabel">📦 Материалы · ${fmt(t.mat)}</div>` + mats.map(itemRow).join('');} if (!works.length && !mats.length) bodyHtml += empty(filterActive ? '🔍 По выбранным комнатам позиций нет' : '📝 Добавьте позиции кнопкой «Позиция» или нажмите «Пересчитать»');}
          else if (estimateView === 'stages') {const stages = STAGES_ALL.slice(0, 4); bodyHtml += card('📝 Позиции', ''); stages.forEach(stage => {const list = items.filter(i => (i.stage || 'Черновые') === stage); if (!list.length) return; const st = list.reduce((s, i) => s + num(i.qty) * num(i.price), 0); bodyHtml += `<div class="sectionlabel">${stageLabel(stage)} · ${fmt(st)}</div>` + list.map(itemRow).join('');}); if (!items.length) bodyHtml += empty('📝 Пока пусто');}
          else {bodyHtml += card('📝 Позиции', ''); (o.rooms || []).forEach(room => {if (filterActive && !estimateRoomFilter.includes(room.id)) return; const list = items.filter(i => i.roomId === room.id); if (!list.length) return; const rt = list.reduce((s, i) => s + num(i.qty) * num(i.price), 0); bodyHtml += `<div class="sectionlabel">${roomEmoji(room)} ${esc(room.name)} · ${fmt(rt)}</div>` + list.map(itemRow).join('');}); if (!filterActive) {const other = items.filter(i => !i.roomId); if (other.length) {const ot = other.reduce((s, i) => s + num(i.qty) * num(i.price), 0); bodyHtml += `<div class="sectionlabel">📋 Прочее · ${fmt(ot)}</div>` + other.map(itemRow).join('');} } if (!items.length) bodyHtml += empty('📝 Пока пусто');}
          bodyHtml += `<div class="hr"></div><div class="totalrow"><span>🔧 Работы</span><b>${fmt(t.work)}</b></div><div class="totalrow"><span>📦 Материалы</span><b>${fmt(t.mat)}</b></div><div class="totalrow"><span>📈 Наценка (${num(db.markup)}%)</span><b>${fmt(t.markup)}</b></div><div class="totalrow"><strong>💰 ИТОГО ${filterActive ? 'по выбранным комнатам' : ''}</strong><b>${fmt(t.total)}</b></div>`;
          let editHtml = '';
          if (editingItem) {const i = o.items.find(x => x.id === editingItem); if (i) editHtml = `<div id="editCard">${card('✏️ Редактирование позиции', `<div class="grid">${inputText('Наименование', i.name, `v=>setItem('${i.id}','name',v)`)}<div class="field"><label>Тип</label><select onchange="setItem('${i.id}','type',this.value)"><option value="work" ${i.type === 'work' ? 'selected' : ''}>🔧 Работа</option><option value="material" ${i.type === 'material' ? 'selected' : ''}>📦 Материал</option></select></div>${input('Единица', i.unit, '', `v=>setItem('${i.id}','unit',v)`)}${input('Количество', i.qty, '', `v=>setItem('${i.id}','qty',v)`)}${input('Цена', i.price, '', `v=>setItem('${i.id}','price',v)`)}${input('Себестоимость', i.cost, '', `v=>setItem('${i.id}','cost',v)`)}${inputText('Раздел', i.group, `v=>setItem('${i.id}','group',v)`)}<div class="field"><label>Помещение</label><select onchange="setItem('${i.id}','roomId',this.value)"><option value="">— Общее —</option>${(o.rooms || []).map(r => `<option value="${r.id}" ${i.roomId === r.id ? 'selected' : ''}>${roomEmoji(r)} ${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Этап</label><select onchange="setItem('${i.id}','stage',this.value)">${STAGES_ALL.map(x => `<option value="${x}" ${i.stage === x ? 'selected' : ''}>${stageLabel(x)}</option>`).join('')}</select></div></div><div class="actions"><button class="btn" onclick="goBack()">✅ Готово</button><button class="btn secondary" onclick="document.getElementById('editCard').scrollIntoView({behavior:'smooth',block:'start'})">↑ К форме</button></div>`)}</div>`;}
          html = selectorCard + headCard + segment + bodyHtml + editHtml;
        }
      }

      if (tab === 'stages') {
        if (!o) html = card('📅 Этапы', empty('Выберите объект'));
        else {const t = totals(o); html = card('📅 Этапы и ход работ', `<p class="hint">Ориентировочная длительность. Средний ремонт новостройки — 2–4 мес.</p>${o.stages.map(s => `<div class="gantt-row"><div class="gantt-label">${stageLabel(s.name)}</div><div class="gantt-bar"><div class="gantt-fill" style="width:${Math.min(100, s.duration * 5)}%">${s.duration} дн.</div></div></div>`).join('')}<div class="hr"></div><div class="hint">💰 Сумма по смете: <b>${fmt(t.total)}</b></div>`);}
      }

      if (tab === 'procurement') {
        if (!o) html = card('🛒 Закупки', empty('Выберите объект'));
        else {const total = o.procurement.reduce((s, p) => s + num(p.qty) * num(p.price), 0); html = card('🛒 Закупки материалов', `<div class="stats"><div class="stat"><div class="n">📦 ${o.procurement.length}</div><div class="l">Позиций</div></div><div class="stat"><div class="n">💵 ${fmt(total)}</div><div class="l">Сумма</div></div></div><div class="actions"><button class="btn" onclick="addProcurement()">➕ Закупка</button></div>`) + card('📋 Список', o.procurement.map(p => `<div class="listitem"><div class="itemhead"><div class="grow"><strong>📦 ${esc(p.name)}</strong><div class="itemmeta">${p.date} · ${p.qty} ${esc(p.unit)} × ${fmt(p.price)}</div></div><div style="text-align:right"><b>${fmt(num(p.qty) * num(p.price))}</b><button class="btn small danger" onclick="delProcurement('${p.id}')">×</button></div></div></div>`).join('') || empty('🛒 Закупок пока нет'));}
      }

      if (tab === 'catalog') {
        html = card('💰 База расценок', `<p class="hint">В каталоге ${CATALOG.length} позиций (стандартных — ${DEFAULT_CATALOG.length}). Редактируйте, добавляйте вручную, импортируйте из Excel или надиктуйте голосом.</p><div class="actions" style="margin-top:0"><button class="btn" onclick="openCatalogEdit()">➕ Добавить вручную</button><button class="btn secondary" onclick="openExcelImport()">📥 Импорт Excel</button><button class="btn secondary" onclick="openVoiceAdd()">🎤 Добавить голосом</button></div><div class="actions" style="margin-top:8px"><button class="btn outline" onclick="downloadExcelTemplate()">📄 Скачать шаблон Excel</button><button class="btn outline" onclick="exportCatalogExcel()">📊 Прайс Excel</button><button class="btn outline" onclick="restoreFullCatalog()">🔄 Восстановить стандартный каталог</button></div>`) + card(`📚 Каталог (${CATALOG.length} позиций)`, CATALOG.map(p => `<div class="listitem"><div class="itemhead"><div class="grow"><strong>${p.type === 'material' ? '📦' : '🔧'} ${esc(p.name)}</strong><div class="itemmeta">${p.type === 'material' ? 'Материал' : 'Работа'} · ${esc(p.group)} · ${esc(p.unit)} · ${stageLabel(p.stage)}</div></div><div style="text-align:right"><b>${fmt(p.price)}</b><div><button class="btn small secondary" onclick="openCatalogEdit('${p.id}')">✏️ Изменить</button> <button class="btn small danger" onclick="deleteCatalog('${p.id}')">×</button></div></div></div></div>`).join(''));
      }

      if (tab === 'money') {
        if (!o) html = card('💵 Финансы', empty('Выберите объект'));
        else {const t = totals(o); const paid = o.payments.reduce((s, p) => s + num(p.amount), 0); const exp = o.expenses.reduce((s, p) => s + num(p.amount), 0); const budgetUsed = t.total > 0 ? Math.min(100, (exp / t.total) * 100) : 0; html = card('💵 Финансы', `<div class="stats"><div class="stat"><div class="n">💰 ${fmt(t.total)}</div><div class="l">Смета</div></div><div class="stat"><div class="n">💳 ${fmt(paid)}</div><div class="l">Получено</div></div><div class="stat"><div class="n">💸 ${fmt(exp)}</div><div class="l">Расходы</div></div><div class="stat"><div class="n">💼 ${fmt(paid - exp)}</div><div class="l">Остаток</div></div><div class="stat"><div class="n">📊 ${budgetUsed.toFixed(0)}%</div><div class="l">Бюджет</div></div><div class="stat"><div class="n">📈 ${fmt(t.profit)}</div><div class="l">Прибыль</div></div></div><div class="totalrow"><span>⏳ Остаток к оплате</span><b>${fmt(t.total - paid)}</b></div>`) + card('➕ Добавить операцию', `<div class="grid"><div class="field"><label>Тип</label><select id="moneyType"><option value="payment">💰 Оплата</option><option value="expense">💸 Расход</option></select></div>${input('💵 Сумма', '', 'type="number" id="moneyAmount"', 'noop')}${input('📅 Дата', today(), 'type="date" id="moneyDate"', 'noop')}${input('💬 Комментарий', '', 'id="moneyNote"', 'noop')}</div><div class="actions"><button class="btn" onclick="addMoney()">💾 Сохранить</button></div>`) + card('💳 Оплаты', o.payments.map(p => moneyRow(p, 'payment')).join('') || empty('💳 Оплат пока нет')) + card('💸 Расходы', o.expenses.map(p => moneyRow(p, 'expense')).join('') || empty('💸 Расходов пока нет'));}
      }

      if (tab === 'docs') {
        if (!o) html = card('📄 Документы', empty('Выберите объект'));
        else html = card('📄 Документы', `<p class="hint">Реквизиты компании берутся из «Настройки».</p><div class="obj-context"><span>📄 Документы для:</span><b>${esc(o.name)} · ${esc(o.kind || '—')}</b></div><div class="grid"><div class="field"><label>🔢 № договора</label><input value="${esc(o.contractNo)}" oninput="setObj('contractNo',this.value)"></div><div class="field"><label>📅 Дата</label><input type="date" value="${esc(o.contractDate)}" oninput="setObj('contractDate',this.value)"></div></div><div class="field" style="margin-top:10px"><label>💬 Условия оплаты</label><textarea oninput="setObj('contractTerms',this.value)">${esc(o.contractTerms)}</textarea></div><div class="actions"><button class="btn" onclick="printDoc('contract')">📜 Договор PDF</button><button class="btn secondary" onclick="printDoc('estimate')">📋 Смета PDF</button><button class="btn secondary" onclick="printDoc('act')">📝 Акт PDF</button><button class="btn secondary" onclick="printDoc('invoice')">🧾 Счёт PDF</button><button class="btn outline" onclick="exportExcel()">📊 Excel</button><button class="btn outline" onclick="exportBackup()">💾 JSON</button></div>`) + card('💰 Сумма', `<div class="totalrow"><span>🏢 Объект</span><b>${esc(o.name)}</b></div><div class="totalrow"><span>📍 Тип</span><b>${esc(o.kind || '—')}</b></div><div class="totalrow"><span>👤 Заказчик</span><b>${esc(o.client || '—')}</b></div><div class="totalrow"><span>💰 Итого</span><b>${fmt(totals(o).total)}</b></div>`) + card('🏢 Реквизиты исполнителя', `<div class="muted">${esc(companyRequisites()) || '— не заполнены —'}</div><div class="actions"><button class="btn secondary" onclick="navigate({tab:'settings'})">⚙️ Изменить</button></div>`);
      }

      if (tab === 'settings') {
        const d = initSettingsDraft(); const dirty = settingsDirty();
        html = '';
        if (dirty) html += `<div class="unsaved">⚠️ Есть несохранённые изменения. Нажмите «Сохранить настройки».</div>`;

        html += card('☁️ Облачная синхронизация', `
      <div class="listitem"><span class="muted">Статус:</span> <b style="color:${cloudSyncEnabled ? 'var(--green)' : 'var(--red)'}">${cloudSyncEnabled ? '✓ Активна' : '⚠ Не подключена'}</b></div>
      <div class="listitem"><span class="muted">Telegram ID:</span> <b>${currentUserId || '—'}</b></div>
      <div class="listitem"><span class="muted">Последняя синхронизация:</span> <b>${lastCloudSyncAt ? new Date(lastCloudSyncAt).toLocaleTimeString('ru-RU') : '—'}</b></div>
      <p class="hint" style="margin-top:10px">Данные хранятся в облаке и синхронизируются между всеми устройствами, где вы открываете приложение под своим Telegram-аккаунтом. Изменения уходят в облако через 1.5 секунды после правки, проверка новых данных с других устройств — каждые 15 секунд.</p>
      ${cloudSyncEnabled ? `<div class="actions"><button class="btn secondary small" onclick="manualCloudSync()">🔄 Синхронизировать сейчас</button></div>` : `<p class="hint" style="color:var(--red)">Синхронизация отключена. Проверьте URL, anon-ключ и деплой Edge Function.</p>`}
    `);

        html += card('🏢 Реквизиты компании', `<p class="hint">Эти данные подставляются в договоры, счета и акты.</p><div class="grid">${inputText('🏷️ Название компании', d.company, 'v=>setDraft("company",v)', 'placeholder="Например: ООО «РемонтПро»"')}${inputText('🔢 ИНН', d.inn, 'v=>setDraft("inn",v)')}${inputText('🔢 ОГРН / ОГРНИП', d.ogrn, 'v=>setDraft("ogrn",v)')}${inputText('👤 Руководитель', d.director, 'v=>setDraft("director",v)')}</div><div class="field" style="margin-top:12px"><label>📍 Юридический адрес</label><input value="${esc(d.legalAddress)}" oninput="setDraft('legalAddress',this.value)" autocomplete="off" spellcheck="false"></div><div class="grid" style="margin-top:12px">${inputText('📱 Телефон', d.phone, 'v=>setDraft("phone",v)', 'type="tel"')}${inputText('📧 Email', d.email, 'v=>setDraft("email",v)', 'type="email"')}${inputText('🌐 Сайт', d.website, 'v=>setDraft("website",v)')}</div>`);
        html += card('📐 Расчёты и договоры', `<p class="hint">Наценка и запас применяются ко всем сметам.</p><div class="grid">${inputText('🏙️ Город / регион цен', d.region, 'v=>setDraft("region",v)')}${inputText('🔢 Префикс № договора', d.contractPrefix, 'v=>setDraft("contractPrefix",v)')}${input('📈 Наценка на смету, %', d.markup, 'type="number" min="0" max="100"', 'v=>setDraft("markup",v)')}${input('📦 Запас материалов, %', d.waste, 'type="number" min="0" max="100"', 'v=>setDraft("waste",v)')}</div>`);

        if (admin) {
          html += card('❤️ Поддержка автора (QR) <span class="badge gold">Только автор</span>', `<p class="hint">Пользователи видят только QR-код — без номера телефона и номера карты.<br>Получите ссылку для QR в приложении своего банка: «Поделиться реквизитами» / «QR-код для перевода» / СБП-ссылка.</p><div style="margin-top:12px">${inputText('🔗 Ссылка для QR-кода', d.donateQrLink, 'v=>setDraft("donateQrLink",v)')}</div><div class="grid" style="margin-top:12px">${inputText('👤 Имя получателя', d.donateName, 'v=>setDraft("donateName",v)')}${inputText('💬 Telegram для связи', d.donateTelegram, 'v=>setDraft("donateTelegram",v)')}</div><div class="field" style="margin-top:12px"><label>📝 Текст благодарности</label><textarea oninput="setDraft('donateMessage',this.value)">${esc(d.donateMessage)}</textarea></div><div class="actions"><button class="btn pink" onclick="commitSettingsDraft(); render(); openDonate();">👀 Посмотреть форму</button></div><div class="admin-hint">Сейчас в форме донатов: <b>${db.donateQrLink ? 'ваша ссылка' : (HARDCODED_DONATE.qrLink ? 'значения из кода' : 'не настроено')}</b>.<br>Чтобы изменения увидели ВСЕ пользователи — обновите <code>HARDCODED_DONATE.qrLink</code> в <code>index.html</code>.</div>`);
        }

        html += card('💾 Сохранение', `<div class="actions" style="margin-top:0"><button class="btn ${dirty ? 'success' : ''}" onclick="saveSettings()">💾 Сохранить настройки</button><button class="btn secondary" onclick="resetSettingsDraft()" ${dirty ? '' : 'disabled'}>↩ Отменить</button></div><p class="hint" style="margin-top:10px">Изменения применяются после «Сохранить». При переходе на другую вкладку — автосохранение.</p>`);
        html += card('💾 Резервное копирование', `<div class="actions" style="margin-top:0"><button class="btn secondary" onclick="exportBackup()">📥 Скачать резервную копию</button><label class="btn secondary" style="display:inline-block;cursor:pointer">📤 Импорт JSON<input type="file" accept="application/json" hidden onchange="importBackup(this.files[0])"></label><button class="btn danger" onclick="resetData()">🗑 Сбросить</button></div>`);
        html += card('✅ Что сохранено', `<div class="listitem"><span class="muted">🏷️ Компания:</span> <b>${db.company && db.company.trim() ? esc(db.company) : '— не заполнена —'}</b></div><div class="listitem"><span class="muted">🔢 ИНН:</span> <b>${esc(db.inn || '—')}</b></div><div class="listitem"><span class="muted">🏙️ Город:</span> <b>${esc(db.region || '—')}</b></div><div class="listitem"><span class="muted">📈 Наценка:</span> <b>${num(db.markup)}%</b></div><div class="listitem"><span class="muted">📚 Расценок в каталоге:</span> <b>${CATALOG.length}</b> (стандартных — ${DEFAULT_CATALOG.length})</div>`);
      }

      if (tab !== 'settings') {const footer = renderSupportFooter(); if (footer) html += footer;}

      a.innerHTML = html;
      const primary = document.getElementById('primary');
      primary.textContent = tab === 'estimate' ? '➕ Добавить позицию' : tab === 'catalog' ? '➕ Добавить расценку' : tab === 'procurement' ? '➕ Добавить закупку' : tab === 'wizard' ? '✅ Создать объект' : tab === 'settings' ? '💾 Сохранить настройки' : '➕ Добавить объект';
      primary.onclick = () => {if (tab === 'estimate') openAddEstimateItem(); else if (tab === 'catalog') openCatalogEdit(); else if (tab === 'procurement') addProcurement(); else if (tab === 'wizard') confirmWizard(); else if (tab === 'settings') saveSettings(); else makeObj();};
      renderDrawer();
      updateBackButton();
    }

    function resetData() {if (confirm('Удалить все данные из браузера? Облачные данные останутся.')) {localStorage.removeItem(STORAGE_KEY); location.reload();} }

    // ============ СТАРТ ============
    document.getElementById('tabs').addEventListener('click', e => {const b = e.target.closest('button[data-tab]'); if (b) navigate({tab: b.dataset.tab, editingItem: null});});
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (donateOpen) {closeDonate(); return;}
        if (menuOpen) {closeMenu(); return;}
        if (catalogEditState || estimateItemVoiceState || estimateAddState || window._pendingImport) {closeCatalogModals(); return;}
        if (document.getElementById('voiceModalHost') && document.getElementById('voiceModalHost').innerHTML) {stopVoice(); return;}
      }
    });
    if (window.Telegram?.WebApp) {Telegram.WebApp.ready(); Telegram.WebApp.expand();}
    applyState({tab: 'home', editingItem: null});
    initCloudSync();
  </script>
  <script src="patch.js"></script>
</body>

</html>
